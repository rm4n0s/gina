<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1196" viewBox="0 0 1800 1196" font-family="system-ui, 'Noto Sans', 'Liberation Sans', sans-serif" role="img" aria-labelledby="t d">
<title id="t">Gina vs Go net/http benchmark results</title>
<desc id="d">Six small charts comparing Gina and net/http on 1 to 8 cores: keep-alive throughput over HTTP and HTTPS, TLS handshakes per second, p99 latency, a 64 KiB echo test and memory use. Gina is faster on every measure except memory. The same numbers are tabulated in docs/BENCHMARKS.md.</desc>
<rect width="1800" height="1196" fill="#1a1a19"/>
<text x="56.0" y="62.0" font-size="34" font-weight="700" text-anchor="start" fill="#ffffff" >Gina vs Go net/http</text>
<text x="56.0" y="94.0" font-size="15" font-weight="400" text-anchor="start" fill="#c3c2b7" >Same cores, same routes, same bodies. Loopback HTTP/1.1, 256 connections, median of three 5 s runs per point.</text>
<text x="56.0" y="116.0" font-size="15" font-weight="400" text-anchor="start" fill="#c3c2b7" >Server pinned to N physical cores; the oha load generator runs on separate cores.</text>
<circle cx="1539.0" cy="57.0" r="6" fill="#d95926"/>
<text x="1553.0" y="62.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >net/http (GOMAXPROCS = N)</text>
<circle cx="1184.2" cy="57.0" r="6" fill="#3987e5"/>
<text x="1198.2" y="62.0" font-size="14" font-weight="400" text-anchor="start" fill="#c3c2b7" >Gina (N worker processes, one thread each)</text>
