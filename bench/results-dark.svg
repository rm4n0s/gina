<text x="56.0" y="1140.0" font-size="13" font-weight="400" text-anchor="start" fill="#c3c2b7" >Not a feature-equal comparison: net/http is a complete, hardened server; Gina's HTTP is minimal and its TLS 1.3 is unaudited (no resumption, no ChaCha20).</text>
<text x="56.0" y="1160.0" font-size="13" font-weight="400" text-anchor="start" fill="#c3c2b7" >Gina scales with N shared-nothing processes, net/http with one multi-threaded process. One machine (AMD Ryzen AI MAX+ 395), Go 1.26, oha 1.16, 2026-10-06. Tables and caveats: docs/BENCHMARKS.md.</text>
